name: Watch zmanim

on:
  schedule:
    # 00:05 Asia/Jerusalem is 21:05 UTC in summer and 22:05 UTC in winter.
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zmanim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Only at Jerusalem midnight, unless run by hand
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Asia/Jerusalem date +%H)
            if [ "$hour" = "00" ]; then
              echo "run=1" >> "$GITHUB_OUTPUT"
            else
              echo "run=0" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.gate.outputs.run == '1'
        run: node scripts/build-watch-zmanim.mjs
      - if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/zmanim.txt watch/zmanim
          if git diff --cached --quiet; then
            echo "zmanim unchanged"
          else
            git commit -m "Update Oranit watch zmanim"
            git push
          fi
